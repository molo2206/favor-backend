# Types MIME des fichiers modernes, pour tous les sites Apache du serveur
# Installation :
#   sudo cp mime-media.conf /etc/apache2/conf-available/
#   sudo a2enconf mime-media && sudo systemctl reload apache2
<IfModule mod_mime.c>
    AddType image/webp .webp
    AddType image/avif .avif
    AddType image/heic .heic
    AddType video/mp4  .mp4 .m4v
    AddType video/webm .webm
    AddType audio/mp4  .m4a
</IfModule>
