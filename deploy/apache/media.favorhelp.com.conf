# =====================================================================
# Domaine média (Apache) : fichiers servis directement, sans passer par l'API
#   https://media.favorhelp.com/<dossier>/<fichier>  →  /var/www/favor-storage/<dossier>/<fichier>
#
# Installation (Ubuntu / Debian) :
#   sudo cp deploy/apache/media.favorhelp.com.conf /etc/apache2/sites-available/
#   sudo a2enmod headers alias
#   sudo a2ensite media.favorhelp.com.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d media.favorhelp.com
#
# DNS : enregistrement A « media » → IP du serveur (même IP que api-prod).
# =====================================================================

<VirtualHost *:80>
    ServerName media.favorhelp.com
    DocumentRoot /var/www/favor-storage

    ServerSignature Off

    # Types des fichiers modernes (sinon Apache n'envoie pas de Content-Type pour .webp
    # et le navigateur affiche le fichier en texte au lieu de l'image)
    AddType image/webp .webp
    AddType image/avif .avif
    AddType image/heic .heic
    AddType video/mp4  .mp4 .m4v
    AddType video/webm .webm
    AddType audio/mp4  .m4a
    LimitRequestBody 1048576

    # Dossier temporaire et fichiers cachés (.env, .git…) : 404
    RedirectMatch 404 "^/temp(/|$)"
    RedirectMatch 404 "/\."

    <Directory /var/www/favor-storage>
        Options -Indexes -ExecCGI -Includes
        AllowOverride None

        # Aucun script exécuté depuis le dossier des fichiers
        RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .phar .cgi .pl .py .sh
        RemoveType .php .phtml .phar

        # Par défaut tout est refusé…
        Require all denied

        # …sauf les types de fichiers publics
        <FilesMatch "\.(?i:webp|jpe?g|png|gif|svg|ico|avif|heic|mp4|webm|mov|m4v|mp3|m4a|aac|ogg|wav|pdf)$">
            Require all granted
        </FilesMatch>
    </Directory>

    <IfModule mod_headers.c>
        Header always set Cache-Control "public, max-age=2592000, immutable"
        Header always set Access-Control-Allow-Origin "*"
        Header always set X-Content-Type-Options "nosniff"
        # Empêche l'exécution de scripts depuis un fichier (SVG notamment)
        Header always set Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/media.favorhelp.com-error.log
    CustomLog ${APACHE_LOG_DIR}/media.favorhelp.com-access.log combined
</VirtualHost>
