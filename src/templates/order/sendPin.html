<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Bienvenue sur FavorHelp</title>
    <style>
      body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(to bottom right, #e7f0fd, #ffffff);
        margin: 0;
        padding: 40px 20px;
        color: #1c1e21;
      }
      .container {
        background: white;
        padding: 50px 30px;
        max-width: 500px;
        margin: 0 auto;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        text-align: center;
      }
      .header {
        font-size: 28px;
        font-weight: bold;
        color: #1877f2;
        margin-bottom: 20px;
      }
      .description {
        font-size: 18px;
        color: #606770;
        margin-bottom: 30px;
        line-height: 1.5;
      }
      .user-name {
        font-size: 24px;
        font-weight: bold;
        color: #1c1e21;
        background: #f0f2f5;
        padding: 15px 0;
        border-radius: 8px;
        margin: 20px 0;
      }
      .message {
        font-size: 16px;
        color: #606770;
        margin: 20px 0;
        line-height: 1.5;
      }
      .btn {
        display: inline-block;
        background: #1877f2;
        color: white;
        text-decoration: none;
        padding: 12px 30px;
        border-radius: 6px;
        font-weight: bold;
        margin: 20px 0 10px;
      }
      .footer {
        margin-top: 40px;
        font-size: 12px;
        color: #90949c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">FavorHelp</div>

      <div class="description">Bienvenue sur FavorHelp !</div>

      <div class="user-name">{{ user.fullName }}</div>

      <div class="message">
        Nous sommes ravis de vous compter parmi notre communauté.<br />
        Votre compte a été activé avec succès.
      </div>

      <a href="#" class="btn">Accéder à mon espace</a>

      <div class="footer">
        &copy; {{ year }} FavorHelp. Tous droits réservés.
      </div>
    </div>
  </body>
</html>
